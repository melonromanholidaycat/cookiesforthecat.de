name: Probe — does a GITHUB_TOKEN push build Pages?

# Temporary. Answers one question: when this workflow's own token pushes a
# commit to main, does GitHub start a "pages build and deployment" run on its
# own? termine.yml asks Pages to rebuild explicitly because it claims the
# answer is no. Nothing here calls that API, so a build can only be automatic.
# Delete this file once the answer is recorded.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push a trivial commit as the workflow token
        run: |
          date -u +"probe %Y-%m-%dT%H:%M:%SZ" > .github/probe.txt
          git config user.name "Calendar sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/probe.txt
          git commit -m "Probe: does this push build Pages?"
          git push
          echo "pushed $(git rev-parse HEAD)"
          echo "PROBE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
