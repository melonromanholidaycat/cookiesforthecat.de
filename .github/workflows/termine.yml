name: Sync gig dates from the calendar

# Pulls the gigs from the shared Google calendar into the pages. Runs hourly;
# "Run workflow" triggers it by hand at any time, for instance when a gig is
# cancelled at short notice.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# One run at a time — two in parallel would overwrite each other.
concurrency:
  group: termine
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: a formatting change in a new release would rewrite every
      # .ics file and redeploy for nothing.
      # dateutil arrives with icalendar anyway; named here because the script
      # imports it directly, and a transitive dependency is not a promise.
      - run: pip install --quiet icalendar==7.3.0 python-dateutil==2.9.0.post0

      - name: Sync the gig dates
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: python3 skripte/termine.py

      - name: Commit any changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The commit message is the review mechanism here, by choice.
          count=$(python3 -c "import json;print(len(json.load(open('daten/termine.json'))))")
          git config user.name "Calendar sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gig dates updated: $count upcoming" \
                     -m "$(git diff --cached --stat)"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      # A commit by this workflow's token does not trigger the Pages build.
      # Verified: without this step the site does not update.
      # Failing here is the one case where the repository is right and the site
      # is wrong, so the job has to go red rather than swallow it.
      - name: Ask Pages to rebuild
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -X POST -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds")
            echo "  Pages build requested: $code (attempt $attempt)"
            [ "$code" = "201" ] && exit 0
            sleep $((attempt * 5))
          done
          echo "::error::Pages did not accept the build request, so the commit is"\
               "live in the repository but not on the site."
          exit 1
