name: Sync gig dates from the calendar

# Pulls the gigs from the shared Google calendar into the pages. Runs hourly;
# "Run workflow" triggers it by hand at any time, for instance when a gig is
# cancelled at short notice.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# One run at a time — two in parallel would overwrite each other.
concurrency:
  group: termine
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned deliberately. The script writes .ics files now, and a
      # formatting change in a new release would land as a commit that rewrites
      # every one of them and redeploys the site for nothing.
      - run: pip install --quiet icalendar==7.3.0

      - name: Sync the gig dates
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: python3 skripte/termine.py

      - name: Commit any changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The commit message names what changed — the GitHub notification
          # is the whole review mechanism here, by choice.
          count=$(python3 -c "import json;print(len(json.load(open('daten/termine.json'))))")
          git config user.name "Calendar sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gig dates updated: $count upcoming" \
                     -m "$(git diff --cached --stat)"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      # A commit made by this workflow's own token does not reliably trigger
      # the Pages build the way a human push does, so the build is requested
      # explicitly. Confirmed working on the first real run: the API answers
      # 201 and the site updates within a minute. Do not remove this step
      # assuming the push alone is enough.
      - name: Ask Pages to rebuild
        if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST -w "  Pages build requested: %{http_code}\n" -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
